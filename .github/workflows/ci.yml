name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    env:
      NODE_ENV: ${{ matrix.environment }}
      PORT: 3000
      FRONTEND_PORT: 4173
      DATA_KEY: ci-prototype-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run build
      - run: npm test
