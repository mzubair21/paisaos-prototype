<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PaisaOS Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>PaisaOS Prototype (P0 Scope)</h1>
      <p id="status" aria-live="polite">Not authenticated.</p>

      <section>
        <h2>Authentication</h2>
        <form id="register-form">
          <input name="email" type="email" placeholder="Email" required />
          <input name="name" placeholder="Name" required />
          <input name="password" type="password" placeholder="Password" required />
          <button type="submit">Register</button>
        </form>
        <form id="login-form">
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
      </section>

      <section>
        <h2>Quick Entry (vertical slices)</h2>
        <button id="seed-data">Seed sample account/category/period/transaction</button>
        <button id="create-pot">Create pot</button>
        <button id="create-goal">Create goal</button>
        <button id="create-loan">Create loan</button>
        <button id="add-net-worth">Add net worth snapshot</button>
        <button id="dashboard">Load dashboard</button>
        <button id="report">Generate monthly report</button>
      </section>

      <section>
        <h2>Output</h2>
        <pre id="output" tabindex="0"></pre>
      </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
